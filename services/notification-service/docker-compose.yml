services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-notification-service
    ports:
      - "8085:8085"
    volumes:
      - .:/app
      - /app/tmp
      - ../../pkg:/app/../pkg
    environment:
      - SERVER_PORT=8085
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - KAFKA_BROKERS=kafka:29092
      - REDIS_ADDR=redis:6379
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - SMTP_ADDR=mailpit:1025
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - fintech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  fintech-network:
    name: fintech-bank-platform_fintech-network
    external: true

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-api-gateway
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - /app/tmp
      - ../../pkg:/app/../pkg
    environment:
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - KAFKA_BROKERS=kafka:29092
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-1m}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - fintech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  fintech-network:
    name: fintech-bank-platform_fintech-network
    external: true

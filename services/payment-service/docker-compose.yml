services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-payment-service
    ports:
      - "8084:8084"
    volumes:
      - .:/app
      - /app/tmp
      - ../../pkg:/app/../pkg
    environment:
      - SERVER_PORT=8084
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - KAFKA_BROKERS=kafka:29092
      - CASSANDRA_HOSTS=cassandra:9042
      - PAYMENT_WEBHOOK_SECRET=dev-webhook-secret
      - PAYMENT_WEBHOOK_URL=http://localhost:8084/webhooks/gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - fintech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  fintech-network:
    name: fintech-bank-platform_fintech-network
    external: true

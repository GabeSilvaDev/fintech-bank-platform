services:
  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-account-service
    ports:
      - "8082:8082"
    volumes:
      - .:/app
      - /app/tmp
      - ../../pkg:/app/../pkg
    environment:
      - SERVER_PORT=8082
      - LOG_LEVEL=debug
      - LOG_PRETTY=true
      - KAFKA_BROKERS=kafka:29092
      - CASSANDRA_HOSTS=cassandra:9042
    networks:
      - fintech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  fintech-network:
    name: fintech-bank-platform_fintech-network
    external: true

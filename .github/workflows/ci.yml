      - name: Coverage report
        run: |
          echo "## Coverage — Account Service (internal/app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
